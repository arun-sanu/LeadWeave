appId: "com.leadweave.leadweave"
productName: "LeadWeave"
directories:
  output: "release"
files:
  - "dist/**/*"
  - "dashboard/dist/**/*"
  - "electron-main.js"
  - "package.json"
extraResources:
  - from: "data"
    to: "data"
win:
  target:
    - target: "nsis"
      arch: ["x64"]
linux:
  target:
    - target: "AppImage"
      arch: ["x64"]
    - target: "deb"
      arch: ["x64"]

