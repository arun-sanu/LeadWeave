directories:
  output: release
  buildResources: build
appId: com.postcard.leadweave
productName: LeadWeave
files:
  - filter:
      - dist/**/*
      - dashboard/dist/**/*
      - electron-main.js
      - package.json
extraResources:
  - from: data
    to: data
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
electronVersion: 43.4.1
