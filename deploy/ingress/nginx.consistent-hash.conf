# Nginx Ingress with Consistent Hashing on Session ID
# Provides 0-hop routing directly to owning LeadWeave cluster replica.

# 1. Extract session identifier from URL path or header
map $request_uri $session_id_from_path {
    ~*^/api/sessions/(?<sid>[^/?#]+) $sid;
    ~*^/api/messages/(?<sid>[^/?#]+) $sid;
    ~*^/api/chats/(?<sid>[^/?#]+)    $sid;
    ~*^/api/contacts/(?<sid>[^/?#]+) $sid;
    ~*^/api/groups/(?<sid>[^/?#]+)   $sid;
    default                          "";
}

# 2. Select routing key: Path :sessionId -> Header X-Session-ID -> Client IP (fallback)
map $session_id_from_path $session_routing_key {
    ""      $http_x_session_id;
    default $session_id_from_path;
}

map $session_routing_key $effective_routing_key {
    ""      $remote_addr;
    default $session_routing_key;
}

# 3. Upstream cluster with Consistent Hashing
upstream leadweave_cluster {
    # Consistent hash on the extracted WhatsApp session ID
    hash $effective_routing_key consistent;

    server leadweave-1:2785 max_fails=3 fail_timeout=15s;
    server leadweave-2:2785 max_fails=3 fail_timeout=15s;
    server leadweave-3:2785 max_fails=3 fail_timeout=15s;

    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name leadweave.example.com;

    # Maximum payload size for media uploads (images, audio, video, docs)
    client_max_body_size 100M;

    # Upstream proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Routing-Key $effective_routing_key;

    # WebSocket Support (Socket.IO Realtime Events)
    location /socket.io/ {
        proxy_pass http://leadweave_cluster;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health Probes (Direct Round-Robin / All Nodes)
    location /api/health {
        proxy_pass http://leadweave_cluster;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Session-Scoped & REST API Endpoints
    location / {
        proxy_pass http://leadweave_cluster;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
